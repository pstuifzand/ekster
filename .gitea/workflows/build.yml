# Test the server and publish static binaries. The old deployment shipped a
# container image to ghcr.io; the new host runs systemd units.
name: build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Vet, test and build
        run: |
          set -eu
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # -trimpath and -buildvcs=false turn off Go's own VCS stamping, so the
          # commit has to be stamped by hand; without it the server reports
          # "dev-n/a" and two deployments look identical in the traces.
          LD="-s -w -X main.Version=build-$SHORT -X main.CommitHash=$SHORT -X main.BuildTime=$BT"
          # Integration tests build their own databases from the app migrations,
          # so they need a live PostgreSQL. It runs on a throwaway network next
          # to the build container; each test creates and drops its own database.
          NET=ekster-ci-$$
          docker rm -f ekster-ci-pg >/dev/null 2>&1 || true
          docker network create "$NET"
          docker run -d --name ekster-ci-pg --network "$NET" \
            --health-cmd 'pg_isready -U postgres' \
            --health-interval 2s --health-retries 30 \
            -e POSTGRES_PASSWORD=ekster-ci postgres:16 >/dev/null
          trap 'docker rm -f ekster-ci-pg >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ekster-ci-pg)" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ekster-ci-pg)" = healthy ]
          # As the runner's own uid: a root-owned artifact in the bind-mounted
          # workspace cannot be removed afterwards and fails the job.
          # The Go caches are docker volumes, not actions/cache: the runner is a
          # single NixOS host, and its cache action cannot save a directory whose
          # path runs through /var/lib/private (the tar manifest ends up
          # relative to the wrong root). A volume keeps modules and compiled
          # packages between runs, so only the first run after a dependency
          # change downloads anything.
          docker volume create ekster-ci-go-mod >/dev/null
          docker volume create ekster-ci-go-build >/dev/null
          # A fresh volume is owned by root; the build container runs as us.
          docker run --rm --entrypoint chown \
            -v ekster-ci-go-mod:/go-mod -v ekster-ci-go-build:/go-build \
            golang:1.27 -R "$(id -u):$(id -g)" /go-mod /go-build
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --network "$NET" \
            -e DATABASE_TEST_URL='postgres://postgres:ekster-ci@ekster-ci-pg:5432/postgres?sslmode=disable' \
            -e GOMODCACHE=/tmp/go-mod \
            -e GOCACHE=/tmp/go-cache \
            -v ekster-ci-go-mod:/tmp/go-mod \
            -v ekster-ci-go-build:/tmp/go-cache \
            -e CGO_ENABLED=0 -e "LD=$LD" -v "$PWD":/src -w /src golang:1.27 \
            sh -c 'go vet ./... && go test ./... && go test -count=1 -tags=integration ./... && \
                   go build -trimpath -buildvcs=false -ldflags="$LD" -o dist/eksterd ./cmd/eksterd && \
                   go build -trimpath -buildvcs=false -ldflags="$LD" -o dist/ek ./cmd/ek'
          ls -l dist
          ( cd dist && sha256sum eksterd ek > SHA256SUMS )

      - name: Publish release
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-$SHORT"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          auth=(-H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json")

          existing=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$API/releases/tags/$TAG")
          if [ "$existing" = "200" ]; then
            id=$(curl -s "${auth[@]}" "$API/releases/tags/$TAG" | jq -r '.id')
            curl -s -X DELETE "${auth[@]}" "$API/releases/$id" >/dev/null
          fi

          curl -sS -f -X POST "${auth[@]}" "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"build $SHORT\",\"body\":\"Static eksterd and ek binaries for $SHORT.\"}" \
            -o /tmp/release.json
          RID=$(jq -r '.id' /tmp/release.json)
          case "$RID" in
            ""|null) echo "could not create release:"; cat /tmp/release.json; exit 1 ;;
          esac

          # Raw bodies: Gitea stores the request body verbatim as the asset.
          for f in dist/eksterd dist/ek dist/SHA256SUMS; do
            curl -sS -f -X POST "${auth[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$API/releases/$RID/assets?name=$(basename "$f")" >/dev/null
            echo "attached $(basename "$f")"
          done
