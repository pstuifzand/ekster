version: '2'
services:
  web:
    image: ghcr.io/pstuifzand/ekster:dev
    command: -auth=false -port 80
    ports:
      - 8089:80
    environment:
      - "EKSTER_BASEURL=http://localhost:8089/"
      # Tracing is off while this is empty. On the p83.nl host set it to
      # http://tempo:4318 and keep this service on nginxproxy_default; locally
      # use http://localhost:4318 with the SSH tunnel open (see docs/tempo.md).
      - "OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      - "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
      - "OTEL_SERVICE_NAME=ekster"

  redis:
    image: "redis:5"

  database:
    image: postgres:14
    volumes:
    - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ekster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: simple
      POSTGRES_HOST_AUTH_METHOD: trust


volumes:
    database-data:
