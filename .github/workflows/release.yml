name: Release ek binary

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Build Linux amd64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archive
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o dist/ek ./cmd/ek
          tar -C dist -czf "dist/ek_${VERSION}_linux_amd64.tar.gz" ek
          cd dist
          sha256sum "ek_${VERSION}_linux_amd64.tar.gz" > "ek_${VERSION}_linux_amd64.tar.gz.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ek_*_linux_amd64.tar.gz
            dist/ek_*_linux_amd64.tar.gz.sha256
