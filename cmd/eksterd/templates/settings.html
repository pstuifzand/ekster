{{define "title"}}Channels - Ekster{{end}}
{{define "content"}}
<div class="page-head">
    <h1>Channels</h1>
    <p class="lede">Every channel this server holds for you. Open one to change what it keeps.</p>
</div>

<div class="table-wrap">
    <table class="table is-fullwidth is-hoverable">
        <thead>
            <tr>
                <th>Name</th>
                <th>UID</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Channels }}
                <tr>
                    <td><a href="/settings/channel?uid={{ .UID }}">{{ .Name }}</a></td>
                    <td class="is-size-7 has-text-grey">{{ .UID }}</td>
                </tr>
            {{ else }}
                <tr>
                    <td colspan="2">No channels yet.</td>
                </tr>
            {{ end }}
        </tbody>
    </table>
</div>
{{end}}
{{template "base.html" .}}
